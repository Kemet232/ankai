[workspace]
resolver = "2"
members = [
    "client",
    "core",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
repository = "https://github.com/Kemet232/ankai"
license = "Apache-2.0"
# Open-source model decided in docs/adr/0007-open-source-model.md.

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
# SQLCipher-backed encrypted SQLite, per docs/adr/0004-e2ee-stack.md's local
# encrypted message database decision. `bundled-sqlcipher` vendors SQLCipher's
# BSD-style-licensed C source through a build script; the `rusqlite` crate
# itself is MIT (see deny.toml's note on why this doesn't need its own
# allow-list entry).
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
# OS secure-storage-backed device secrets (macOS Keychain / Windows Credential
# Manager / Linux Secret Service), per docs/adr/0004-e2ee-stack.md's "Key
# management" section: the local DB encryption key is a device-local secret,
# generated on first run, never derived from or escrowed with the server.
# Default features are exactly the cross-platform set the ADR calls for (no
# extra feature flags needed): "v1" pulls in the Apple-native keychain store
# on macOS/iOS, the Windows Credential Manager store on Windows, and the
# zbus-based Secret Service store on other Unix targets.
keyring = "4"
# Device-local secret generation (the DB encryption passphrase above), not
# used for anything cryptographically load-bearing beyond that yet — MLS's
# own crypto is provided by openmls_rust_crypto, not this.
rand = "0.9"
# Cross-platform app data directory resolution (macOS Standard Directories /
# Windows Known Folder API / Linux XDG base dirs), used by the client to
# decide where the encrypted local database file lives.
directories = "6"
# Generic P2P data transport (dial-by-public-key QUIC), per
# docs/adr/0003-p2p-networking-stack.md.
iroh = "1"
# Async runtime iroh itself requires. `rt-multi-thread` for real use,
# `macros` for #[tokio::main]/#[tokio::test], `io-util` for the
# AsyncRead/AsyncWriteExt trait methods iroh's send/recv streams implement.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
