[workspace]
resolver = "2"
members = [
    "client",
    "core",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
repository = "https://github.com/Kemet232/ankai"
license = "Apache-2.0"
# Open-source model decided in docs/adr/0007-open-source-model.md.

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
# SQLCipher-backed encrypted SQLite, per docs/adr/0004-e2ee-stack.md's local
# encrypted message database decision. `bundled-sqlcipher` vendors SQLCipher's
# BSD-style-licensed C source through a build script; the `rusqlite` crate
# itself is MIT (see deny.toml's note on why this doesn't need its own
# allow-list entry).
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
