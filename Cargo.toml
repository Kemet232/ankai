[workspace]
resolver = "2"
members = [
    "client",
    "core",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
repository = "https://github.com/Kemet232/ankai"
license = "Apache-2.0"
# Open-source model decided in docs/adr/0007-open-source-model.md.

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
