[workspace]
resolver = "2"
members = [
    "client",
    "core",
    "server/directory",
    "tools/nat-probe",
    "tools/webrtc-audio-probe",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
repository = "https://github.com/Kemet232/ankai"
license = "Apache-2.0"
# Open-source model decided in docs/adr/0007-open-source-model.md.

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# JSON (de)serialization — used by `tools/nat-probe` to serialize an
# `iroh::EndpointAddr` to a copy-pasteable single line for its manual
# two-machine test, and by `core::messaging` to turn a peer's `EndpointAddr`
# (already `#[derive(Serialize, Deserialize)]` in iroh-base) into a string a
# user can paste/share out-of-band, without inventing a custom wire format.
# Already present in Cargo.lock transitively (several existing deps pull it
# in), so this adds no new crate to the dependency tree, just a direct
# workspace reference to one already there.
serde_json = "1"
thiserror = "1"
# SQLCipher-backed encrypted SQLite, per docs/adr/0004-e2ee-stack.md's local
# encrypted message database decision. `bundled-sqlcipher` vendors SQLCipher's
# BSD-style-licensed C source through a build script; the `rusqlite` crate
# itself is MIT (see deny.toml's note on why this doesn't need its own
# allow-list entry).
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
# OS secure-storage-backed device secrets (macOS Keychain / Windows Credential
# Manager / Linux Secret Service), per docs/adr/0004-e2ee-stack.md's "Key
# management" section: the local DB encryption key is a device-local secret,
# generated on first run, never derived from or escrowed with the server.
# Default features are exactly the cross-platform set the ADR calls for (no
# extra feature flags needed): "v1" pulls in the Apple-native keychain store
# on macOS/iOS, the Windows Credential Manager store on Windows, and the
# zbus-based Secret Service store on other Unix targets.
keyring = "4"
# Device-local secret generation (the DB encryption passphrase above), not
# used for anything cryptographically load-bearing beyond that yet — MLS's
# own crypto is provided by openmls_rust_crypto, not this.
rand = "0.9"
# Cross-platform app data directory resolution (macOS Standard Directories /
# Windows Known Folder API / Linux XDG base dirs), used by the client to
# decide where the encrypted local database file lives.
directories = "6"
# Generic P2P data transport (dial-by-public-key QUIC), per
# docs/adr/0003-p2p-networking-stack.md.
iroh = "1"
# Async runtime iroh itself requires. `rt-multi-thread` for real use,
# `macros` for #[tokio::main]/#[tokio::test], `io-util` for the
# AsyncRead/AsyncWriteExt trait methods iroh's send/recv streams implement.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
# Real-time audio/video media stack, per docs/adr/0003-p2p-networking-stack.md's
# "Real-time media: WebRTC" decision. Used only by `tools/webrtc-audio-probe`
# (ADR-0003 spike 2), not by `core`/`client` yet. `webrtc` is the async-friendly
# wrapper crate; `rtc` (below) is its Sans I/O core, which application code also
# needs directly for media-engine/codec/SDP/stats types — see webrtc-rs's own
# examples, which import from both crates side by side. Pinned to the "0.20"
# line the ADR calls out by name ("start with webrtc-rs v0.20"); 0.20.2 is the
# actual latest stable at the time this was added (0.21 exists only as an
# alpha).
webrtc = "0.20"
# See `webrtc`'s comment above — webrtc-rs v0.20's Sans I/O core crate,
# depended on directly for `MediaEngine`/codec-registration/SDP/stats types.
rtc = "0.20"
# Real Opus encode/decode for `tools/webrtc-audio-probe`'s synthetic-tone
# pipeline test (ADR-0003 spike 2) — webrtc-rs's `TrackLocalStaticSample`
# packetizes already-encoded media, it does not encode audio itself. Safe Rust
# bindings (MIT/Apache-2.0) over `audiopus_sys` (ISC), which vendors and
# builds libopus's own C source at compile time (same "vendor + build,
# no system package required" shape as `rusqlite`'s `bundled-sqlcipher`
# above) — see this crate's own Cargo.toml doc comment for the one build-time
# caveat that vendored build hits on modern CMake.
opus = "0.3"
# `Sample.data` (rtc_media's encoded-frame type, re-exported as `rtc::media::Sample`)
# is a `bytes::Bytes`; used directly to wrap Opus-encoded frames without an
# extra copy through a `Vec<u8>` conversion path. Already in the dependency
# tree transitively via `webrtc`/`rtc`, so this adds no new crate.
bytes = "1"
# `webrtc`'s own `PeerConnectionEventHandler`/`PeerConnection` traits are
# `#[async_trait]`-based (native async-fn-in-trait isn't dyn-compatible,
# and both traits are used as `Arc<dyn ...>`), so an `impl
# PeerConnectionEventHandler` needs the same macro on the impl block.
# Already in the dependency tree transitively via `webrtc`/`rtc`.
async-trait = "0.1"
# HTTP client. Originally added as a direct dependency of `server/directory`
# (`HttpDirectoryClient`'s transport — see that crate's Cargo.toml for the
# "already transitive via iroh/iroh-relay" provenance note); promoted to a
# workspace dependency here so `core::anime` (a second, unrelated consumer —
# AniList's public GraphQL API, not ANKAI's own infrastructure) reuses the
# exact same resolved version/feature set instead of pulling in a second
# HTTP client crate. `default-features = false` + explicit `rustls` avoids
# also pulling in the `native-tls`/OpenSSL backend; `json` for typed
# request/response bodies.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
