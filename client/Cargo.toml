[package]
name = "client"
version.workspace = true
edition.workspace = true
repository.workspace = true

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
ankai-core = { path = "../core" }
# Rust API per ADR-0002 (docs/adr/0002-native-ui-stack.md), royalty-free
# license tier. `renderer-skia` is added on top of the default feature set
# (which already includes renderer-femtovg + renderer-software) so the
# glass/blur spike can select Skia at runtime via BackendSelector while
# still keeping FemtoVG/software available as the Potato-mode fallback
# path without a second build.
slint = { version = "1.17", features = ["renderer-skia"] }
# Cross-platform app data directory resolution — see root Cargo.toml.
directories.workspace = true
# Async runtime to drive ankai_core::p2p/messaging's async API from this
# otherwise-synchronous client binary — see main.rs's P2P setup for how this
# runtime and Slint's own (blocking, main-thread) event loop coexist.
tokio.workspace = true
# HttpDirectoryClient, per docs/adr/0008-identity-discovery-service.md
# (Status: Proposed) — an optional, opt-in path (see main.rs: only used if
# ANKAI_DIRECTORY_URL is set at startup) that replaces core::messaging's
# manual full-PeerInvite paste with a lookup by a peer's short DeviceId
# against a real running ankai-directory-server. Compiling this dependency
# in unconditionally is fine: the ADR being Proposed, not Accepted, gates
# *talking to a real network service*, which stays opt-in at runtime via the
# env var, not at compile time — see core::messaging's module doc comment.
ankai-directory-server = { path = "../server/directory" }
# Needed to call HttpDirectoryClient::new/device_signer's SignatureKeyPair
# type by name, and to bring the OpenMlsProvider trait (for
# AnkaiMlsProvider::storage()) into scope — same versions ankai-core pins,
# so the workspace resolves one copy of each.
openmls = "0.8.1"
openmls_basic_credential = "0.5.0"
# HTTP client for `client::images`' real anime-cover-art fetch (real bytes
# from AniList's CDN, over HTTPS) — see root Cargo.toml's `reqwest` entry
# for the full provenance note. `client` didn't need this directly before
# (ankai-core used it internally for live metadata clients); now it does its own
# fetching of the image bytes AniList already gives it a URL for.
reqwest.workspace = true
# Real JPEG/PNG decode for `client::images` (fetched cover-art bytes ->
# `image::DynamicImage` -> `slint::SharedPixelBuffer`/`slint::Image::
# from_rgba8`, entirely in memory — no file written to disk). Version and
# feature set (`png`, `jpeg`, no other formats) deliberately match exactly
# what `i-slint-core`'s own `image-decoders`/`std` feature already pulls in
# for `slint::Image::load_from_path`'s internal use (see that crate's
# Cargo.toml) — AniList's real cover images are JPEG (confirmed via the
# real captured fixture in core::anime's tests), so this adds no new
# compiled codec surface to the workspace, just a direct reference to the
# same resolved crate/feature set already being built.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
# Real local-clock time-of-day for the Home dashboard's greeting ("good
# morning"/"good afternoon"/"good evening" — see app.slint's
# time-of-day-greeting property doc comment). Already resolved as a
# transitive dependency in Cargo.lock (via reqwest and others), so this just
# promotes it to a direct one rather than adding a new crate to the build
# graph. `default-features = false` + `clock` only: this doesn't need
# chrono's serde/wasm/etc extras, just Local::now().
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Runtime-only libmpv loading. The shared library is shipped beside the app
# (LGPL build per ADR-0006), never statically linked into this executable.
libloading = "0.8"
libc = "0.2"
# Same OpenGL loader/version used by Slint's FemtoVG renderer. This is used
# only inside rendering-notifier callbacks, where Slint guarantees its context
# is current, to allocate the bounded libmpv texture/FBO pair.
glow = "0.17"

[build-dependencies]
slint-build = "1.17"
