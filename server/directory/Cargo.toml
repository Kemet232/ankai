[package]
name = "ankai-directory-server"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

# Reference implementation of docs/adr/0008-identity-discovery-service.md:
# a real HTTP+JSON server (binary target below) for publish/lookup of
# KeyPackages and EndpointAddrs, plus (library target) HttpDirectoryClient,
# a second real `ankai_core::directory::DirectoryService` implementation
# that talks to it over the network, proving the trait boundary
# `InMemoryDirectory` already validated in-process also works against a
# genuine server. See this crate's src/lib.rs doc comment and the ADR for
# what is and isn't decided/built here.

[[bin]]
name = "ankai-directory-server"
path = "src/main.rs"

[lib]
name = "ankai_directory_server"
path = "src/lib.rs"

[dependencies]
ankai-core = { path = "../../core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
# SQLite storage per the ADR's "Storage" section — already a workspace
# dependency (used client-side, SQLCipher-encrypted, for the local device
# DB). This crate uses the same crate but an *unencrypted* file/in-memory
# connection: nothing this server stores is confidential (KeyPackages are
# public MLS prekey material by design; EndpointAddrs are reachability
# hints, not credentials) — see the ADR for why encrypting it would be
# theater, not defense.
rusqlite.workspace = true
# HTTP+JSON transport per the ADR's "Transport" section. Version pinned to
# match the 0.8.x line already current as of the ADR's research (0.8.9).
axum = "0.8"
# Real ED25519 verification of device-signed publish requests, per the
# ADR's "Auth" section. This is *not* a new cryptographic primitive:
# `openmls_basic_credential::SignatureKeyPair::sign` (already used by
# `ankai_core::identity`) is itself implemented on top of exactly this
# crate at exactly this major version (confirmed by reading
# openmls_basic_credential's own source) — already a transitive dependency
# of this workspace at 2.2.0. Pinning "2" here reuses that resolved
# version rather than introducing a second major version into the graph.
ed25519-dalek = "2"
# MLS KeyPackage/prekey type this server stores and hands back — same
# version ankai-core pins, so both crates resolve to one copy.
openmls = "0.8.1"
# Signer/SignatureScheme traits/types used by HttpDirectoryClient to sign
# outgoing requests with a device's real SignatureKeyPair — same version
# openmls_basic_credential (an ankai-core dependency) itself depends on.
openmls_traits = "0.5.0"
openmls_basic_credential = "0.5.0"
# Generic P2P address type this server stores and hands back, per
# docs/adr/0003-p2p-networking-stack.md — same version ankai-core pins.
iroh.workspace = true
# HTTP client for HttpDirectoryClient. Already a *transitive* dependency of
# this exact workspace at 0.13.4 (pulled in by iroh/iroh-relay) — this adds
# it as a direct dependency of this crate rather than introducing a new
# HTTP stack; see the ADR's "Transport" section for the Cargo.lock evidence.
reqwest.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
