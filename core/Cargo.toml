[package]
name = "ankai-core"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# MLS/RFC 9420 engine + RustCrypto-backed provider, per docs/adr/0004-e2ee-stack.md.
openmls = "0.8.1"
openmls_rust_crypto = "0.5.1"
# Basic-credential signature keypairs (openmls's own org crate) — version
# pinned to match what openmls 0.8.1 itself depends on internally.
openmls_basic_credential = "0.5.0"
# Only for the `signatures::Signer` trait (SignatureKeyPair::sign) — needed
# by core::friends to sign/verify plain (non-MLS) friend-request messages
# directly with a device's real signature key, without OpenMLS's own group
# API in between. `openmls::prelude` re-exports `OpenMlsCrypto` (used for
# signature *verification*) but not `signatures::Signer`, and
# `SignatureKeyPair::private()` (the alternative to get raw key bytes out)
# is gated behind openmls_basic_credential's own "test-utils" feature — so
# going through the real `Signer` trait is the only non-hacky option.
# Already present in Cargo.lock transitively at this exact version (both
# openmls and openmls_basic_credential depend on it), so this adds no new
# crate to the dependency tree, just a direct workspace reference.
openmls_traits = "0.5.0"
# SQLCipher-backed encrypted SQLite for local persistence, per
# docs/adr/0004-e2ee-stack.md.
rusqlite.workspace = true
# OS-secure-storage-backed device DB key, per docs/adr/0004-e2ee-stack.md's
# "Key management" section — see root Cargo.toml for the feature-selection
# rationale.
keyring.workspace = true
rand.workspace = true
# Generic P2P data transport, per docs/adr/0003-p2p-networking-stack.md —
# see root Cargo.toml for the feature-selection rationale.
iroh.workspace = true
# "time" adds tokio::time::timeout, used by core::friends's on-demand
# presence check (a short-timeout real connection attempt, not a stored
# flag — see that module's doc comment) — the workspace default feature set
# doesn't include it, same additive pattern tools/nat-probe and
# tools/webrtc-audio-probe already use for the same reason.
tokio = { workspace = true, features = ["time", "net"] }
# HTTP client shared by the live third-party integrations in this crate —
# including AniList, Jikan, Last.fm, and Stremio. See the root Cargo.toml's
# `reqwest` entry for the common feature-selection rationale.
reqwest.workspace = true
# Letterboxd exposes a documented public RSS feed rather than an open review
# API. `core::letterboxd` parses that XML locally; this crate was already in
# the workspace lockfile transitively, and is intentionally used without an
# HTML scraper because the integration never requests arbitrary page HTML.
roxmltree = "0.21"
# Real Ed25519 keypair for the account-root-key model, per
# docs/adr/0009-account-system.md — used directly (not via
# `openmls_basic_credential::SignatureKeyPair`, unlike device keys) because
# an account root key needs deterministic construction from a recovery
# phrase's raw entropy (`SigningKey::from_bytes`), which `SignatureKeyPair`
# doesn't expose. Already a transitive dependency at this exact major
# version (via `openmls_basic_credential`, confirmed by reading its source
# in docs/adr/0008-identity-discovery-service.md's research) — pinning "2"
# here reuses that resolved version rather than introducing a second major
# version into the graph, same reasoning `server/directory`'s Cargo.toml
# already documents for its own direct `ed25519-dalek` dependency.
ed25519-dalek = "2"
# BIP39 mnemonic recovery phrase + self-certifying account-id hashing, per
# docs/adr/0009-account-system.md — see root Cargo.toml for the
# feature/provenance rationale on both.
bip39.workspace = true
blake3.workspace = true
