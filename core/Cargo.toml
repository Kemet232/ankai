[package]
name = "ankai-core"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# MLS/RFC 9420 engine + RustCrypto-backed provider, per docs/adr/0004-e2ee-stack.md.
openmls = "0.8.1"
openmls_rust_crypto = "0.5.1"
# Basic-credential signature keypairs (openmls's own org crate) — version
# pinned to match what openmls 0.8.1 itself depends on internally.
openmls_basic_credential = "0.5.0"
# SQLCipher-backed encrypted SQLite for local persistence, per
# docs/adr/0004-e2ee-stack.md.
rusqlite.workspace = true
# OS-secure-storage-backed device DB key, per docs/adr/0004-e2ee-stack.md's
# "Key management" section — see root Cargo.toml for the feature-selection
# rationale.
keyring.workspace = true
rand.workspace = true
# Generic P2P data transport, per docs/adr/0003-p2p-networking-stack.md —
# see root Cargo.toml for the feature-selection rationale.
iroh.workspace = true
tokio.workspace = true
# HTTP client for `core::mal_forums`'s MyAnimeList forum API client — see
# root Cargo.toml's `reqwest` entry for the full provenance note.
reqwest.workspace = true
